# PR validation — pytest + ruff + npm build + link check on changed URLs
# (CLAUDE.md §9 Task 7 step 3).

name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python project (all extras)
        run: uv sync --extra dev --extra scraping --extra classifier --extra notebook
      - name: Ruff
        run: uv run ruff check pipelines scripts tests
      - name: Pytest (with diff.py coverage gate ≥90%)
        run: |
          uv run pytest tests/ -q \
            --cov=pipelines.diff \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Venue pages in sync with data/
        run: uv run python scripts/generate_venue_pages.py --check

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build Observable Framework site
        run: npm run build

  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            sources/**/*.yml
            sources/**/*.md
            data/**/*.csv
            src/**/*.md
      - name: Lychee link check on changed files
        if: steps.changed.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          # Per-URL exclusions live in .lycheeignore, where each one
          # states why it is there. Three settings need explaining here:
          #
          # --accept 403: coe.int, iso.org and mofa.go.jp answer a CI
          #   checker with 403 while serving fine in a browser. A 403
          #   cannot distinguish "gone" from "refuses robots", so failing
          #   on it only teaches people to ignore this job.
          # --user-agent: lychee calls itself `lychee/x.y`, which several
          #   WAFs reject outright. This one still says what it is and
          #   links back here rather than impersonating a browser — a
          #   checker that lies about itself is not one to trust.
          # No --exclude-mail: lychee v2 removed it and rejects the whole
          #   invocation with a usage error (exit 2) rather than ignoring
          #   it, so every PR failed this job before a single URL was
          #   fetched. Excluding mailto: is v2's default.
          args: >-
            --no-progress
            --accept 200..=299,403,429
            --user-agent "Mozilla/5.0 (compatible; agv-tracker-linkcheck/1.0; +https://github.com/s00048ri/agv-tracker)"
            --exclude-path node_modules
            ${{ steps.changed.outputs.all_changed_files }}
          fail: true
