# AGV Tracker — Source Registry
#
# Single source of truth for external sources used by the pipeline.
# See CLAUDE.md §5 for the three-layer model (discovery | verification | background).
#
# Schema for each entry:
#   id                     required, snake_case, globally unique
#   name                   required, human-readable
#   url                    required
#   role                   required, one of: discovery | verification | background
#   entity_types_covered   required for discovery/verification; list of AGVO §3.3 D1 values
#                          (use [] for background or if role=discovery but not entity-scoped)
#   fetcher_module         optional; Python dotted path (null if no fetcher yet / manual only)
#   fetch_strategy         one of: http_static | http_with_playwright_fallback | manual
#                          (required for discovery sources that are or will be fetched)
#   update_frequency       human-readable cadence label (e.g. monthly, quarterly, annual, ad_hoc)
#   last_verified_alive    ISO date; last day the URL was manually confirmed reachable
#   notes                  optional freeform
#
# Invariants (enforced by scripts/generate_coverage_matrix.py):
#   - Every AGVO §3.3 entity_type must appear in entity_types_covered of ≥1 verification entry.
#   - Background sources never populate data/*.csv; they are for methodology.md citation only.
#   - A source may be listed as both discovery and verification only via TWO separate entries
#     with different ids (e.g., oecd_ai_discovery + oecd_ai_official_pages).

sources:

