[project]
name = "agv-tracker"
version = "0.3.0"
description = "AGV Tracker — empirical documentation of AI governance venues"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ren Iida" }]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
scraping = ["playwright>=1.45"]
classifier = ["anthropic>=0.35"]
review = ["flask>=3.0"]
notebook = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6.29",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines", "tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
